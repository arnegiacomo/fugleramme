<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate review</title>
<style>
  :root { --bg:#2b2d30; --panel:#35383c; --line:#4a4e53; --ink:#e8e6e1; --dim:#a3a7ad; --accent:#e9b44c; --ok:#6fbf73; --bad:#e2675f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
  header .count { color:var(--dim); }
  button, select { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 11px; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.on { background:var(--accent); color:#1d1d1d; border-color:var(--accent); }
  button.ok.on { background:var(--ok); border-color:var(--ok); }
  button.bad.on { background:var(--bad); border-color:var(--bad); }
  .spacer { flex:1; }
  main { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); gap:16px; padding:16px; }
  @media (max-width: 1100px) { main { grid-template-columns:1fr; } }
  .title { display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; margin-bottom:8px; }
  .title h2 { margin:0; font-size:20px; font-weight:600; }
  .title code, .title a { color:var(--dim); font-size:12px; }
  .title a { text-decoration:underline; }
  .stage { position:relative; background:#1f2022; border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:crosshair; }
  .stage img, .zoom .layer { position:absolute; inset:0; opacity:0; transition:opacity .12s linear; }
  .stage img { width:100%; height:100%; display:block; }
  .show-scan .l-scan, .show-plate .l-plate, .show-flags .l-flags, .show-diff .l-diff { opacity:1; }
  .badge { position:absolute; top:10px; left:10px; z-index:2; padding:3px 10px; border-radius:4px; font-weight:700; letter-spacing:.08em; font-size:12px; background:#000a; }
  .show-scan .badge { color:#9fd0ff; } .show-plate .badge { color:var(--accent); } .show-flags .badge, .show-diff .badge { color:var(--bad); }
  .marks { position:absolute; inset:0; pointer-events:none; z-index:1; }
  .marks div { position:absolute; border:1.5px solid #e9b44ccc; color:#e9b44c; font-size:11px; font-weight:700; padding:1px 3px; text-shadow:0 0 3px #000; }
  .hide-marks .marks { display:none; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:10px 0; }
  .controls label { color:var(--dim); display:flex; align-items:center; gap:6px; }
  .verdict { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; margin-top:6px; }
  textarea { flex:1; min-width:220px; min-height:54px; font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .facts { color:var(--dim); font-size:12px; margin-top:8px; }
  .facts b { color:var(--ink); font-weight:600; }
  .facts .warn { color:var(--bad); }
  .zooms { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; align-content:start; }
  .zoom { position:relative; aspect-ratio:4 / 3; background:#1f2022; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .zoom .layer { background-repeat:no-repeat; image-rendering:auto; }
  .zoom .tag { position:absolute; left:8px; bottom:6px; z-index:2; font-size:11px; font-weight:700; color:var(--accent); background:#000a; padding:1px 7px; border-radius:4px; }
  .zoom.loupe { border-color:var(--accent); }
  .strip { display:flex; gap:8px; overflow-x:auto; padding:10px 16px 16px; border-top:1px solid var(--line); }
  .strip button { padding:3px; border-width:2px; flex:none; position:relative; background:#1f2022; }
  .strip img { display:block; width:72px; height:72px; object-fit:contain; border-radius:3px; }
  .strip button.cur { border-color:var(--accent); }
  .strip button.pass::after, .strip button.fail::after { content:""; position:absolute; right:4px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--ok); }
  .strip button.fail::after { background:var(--bad); }
  kbd { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:0 5px; font:12px ui-monospace, Menlo, monospace; }
  .help { color:var(--dim); font-size:12px; padding:0 16px 8px; }
</style>
</head>
<body class="show-scan">
<header>
  <h1>Plate review</h1>
  <span class="count" id="count"></span>
  <button id="prev">&larr; Prev</button>
  <button id="next">Next &rarr;</button>
  <span class="spacer"></span>
  <span class="count" id="tally"></span>
  <button id="copy">Copy review notes</button>
</header>
<main>
  <section>
    <div class="title"><h2 id="name"></h2><code id="file"></code><a id="src" target="_blank" rel="noopener"></a></div>
    <div class="stage" id="stage">
      <span class="badge" id="badge">SCAN</span>
      <img class="l-scan" id="i-scan" alt="scan crop"><img class="l-plate" id="i-plate" alt="plate on paper"><img class="l-flags" id="i-flags" alt="suspect pixels"><img class="l-diff" id="i-diff" alt="changed pixels">
      <div class="marks" id="marks"></div>
    </div>
    <div class="controls">
      <button id="play" class="on">Toggle &#9208;</button>
      <button data-mode="scan">1 Scan</button>
      <button data-mode="plate">2 Plate</button>
      <button data-mode="flags">3 Flags</button>
      <button data-mode="diff">4 Diff</button>
      <label>Speed <input type="range" id="speed" min="300" max="2500" step="100" value="1100" style="direction:rtl"></label>
      <label><input type="checkbox" id="showmarks" checked> zoom boxes</label>
    </div>
    <div class="verdict">
      <button class="ok" id="pass">Pass</button>
      <button class="bad" id="fail">Needs work</button>
      <textarea id="note" placeholder="What is wrong, and where. Saved in this browser."></textarea>
    </div>
    <div class="facts" id="facts"></div>
  </section>
  <section class="zooms" id="zooms"></section>
</main>
<div class="help"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> birds &nbsp; <kbd>space</kbd> start or stop the toggle &nbsp; <kbd>1</kbd> scan &nbsp; <kbd>2</kbd> plate &nbsp; <kbd>3</kbd> suspect pixels &nbsp; <kbd>4</kbd> changed from scan &nbsp; <kbd>p</kbd> pass &nbsp; <kbd>f</kbd> needs work &nbsp; Hover the big image to steer the loupe.</div>
<nav class="strip" id="strip"></nav>
<script src="birds.js"></script>
<script>
const BIRDS = window.BIRDS || [];
const $ = id => document.getElementById(id);
const LABEL = { scan: "SCAN", plate: "PLATE ON PAPER", flags: "SUSPECT PIXELS", diff: "CHANGED FROM SCAN" };
const store = { get: k => { try { return JSON.parse(localStorage.getItem("plate-review") || "{}")[k] || {}; } catch { return {}; } },
  set: (k, v) => { try { const all = JSON.parse(localStorage.getItem("plate-review") || "{}"); all[k] = v; localStorage.setItem("plate-review", JSON.stringify(all)); } catch {} } };
let at = 0, mode = "scan", playing = true, timer = null, loupe = null;

function setMode(m) {
  mode = m;
  document.body.classList.remove("show-scan", "show-plate", "show-flags", "show-diff");
  document.body.classList.add("show-" + m);
  $("badge").textContent = LABEL[m];
  document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", !playing && b.dataset.mode === m));
}
function tick() { setMode(mode === "scan" ? "plate" : "scan"); }
function play(on) {
  playing = on; clearInterval(timer);
  if (on) timer = setInterval(tick, +$("speed").value);
  $("play").classList.toggle("on", on);
  $("play").innerHTML = on ? "Toggle &#9208;" : "Toggle &#9654;";
  setMode(mode);
}
function place(box, x, y, w) {            // show plate px (x, y, w wide) in a zoom box
  const b = BIRDS[at], k = box.clientWidth / w;
  box.querySelectorAll(".layer").forEach(l => {
    l.style.backgroundSize = `${b.w * k}px ${b.h * k}px`;
    l.style.backgroundPosition = `${-x * k}px ${-y * k}px`;
  });
}
function zoomBox(tag, cls) {
  const b = BIRDS[at], box = document.createElement("div");
  box.className = "zoom " + (cls || "");
  for (const l of ["scan", "plate", "flags", "diff"]) {
    const d = document.createElement("div");
    d.className = "layer l-" + l; d.style.backgroundImage = `url(img/${b.id}/${l}.jpg)`; box.append(d);
  }
  const t = document.createElement("span"); t.className = "tag"; t.textContent = tag; box.append(t);
  return box;
}
function layout() {
  const b = BIRDS[at];
  document.querySelectorAll("#zooms .zoom").forEach((box, i) => {
    if (i === 0) place(box, loupe.x, loupe.y, 200);
    else { const z = b.zooms[i - 1]; place(box, z[0], z[1], z[2]); }
  });
}
function show(i) {
  at = (i + BIRDS.length) % BIRDS.length;
  const b = BIRDS[at], saved = store.get(b.id);
  $("count").textContent = `${at + 1} of ${BIRDS.length}`;
  $("name").textContent = b.name; $("file").textContent = `${b.file}  -  PR #${b.pr}`;
  $("src").textContent = b.url ? `${b.source} plate` : ""; $("src").href = b.url || "#";
  $("stage").style.aspectRatio = `${b.w} / ${b.h}`;
  $("stage").style.maxWidth = `calc(74vh * ${b.w / b.h})`;
  for (const l of ["scan", "plate", "flags", "diff"]) $("i-" + l).src = `img/${b.id}/${l}.jpg`;
  $("marks").innerHTML = b.zooms.map((z, n) => `<div style="left:${z[0] / b.w * 100}%;top:${z[1] / b.h * 100}%;width:${z[2] / b.w * 100}%;height:${z[3] / b.h * 100}%">${n + 1}</div>`).join("");
  $("facts").innerHTML = `Suspect pixels: <b>${b.suspect.toLocaleString()}</b>. Gaps between legs and perch count too, so read the red layer before judging.` +
    ` Changed from scan: <b>${(b.changed || 0).toLocaleString()}</b> px (red in mode 4; blue there is ink that was cut away).` +
    (b.ring ? ` <span class="warn">${b.ring} dark pixels in the soft outer edge: these print as a dotted ring on the paper, shown in magenta.</span>` : ` Outer edge clean.`) +
    (b.match < 0.97 ? ` <span class="warn">Scan and plate line up only ${Math.round(b.match * 100)}%: the shipped file may be newer than the saved cut.</span>` : "");
  loupe = { x: b.w / 2 - 100, y: b.h / 2 - 75 };
  const zooms = $("zooms"); zooms.innerHTML = "";
  zooms.append(zoomBox("Loupe - hover the plate", "loupe"));
  b.zooms.forEach((z, n) => zooms.append(zoomBox(String(n + 1))));
  layout();
  $("note").value = saved.note || "";
  $("pass").classList.toggle("on", saved.verdict === "pass"); $("fail").classList.toggle("on", saved.verdict === "fail");
  strip();
}
function strip() {
  $("strip").innerHTML = "";
  let pass = 0, fail = 0;
  BIRDS.forEach((b, i) => {
    const v = store.get(b.id).verdict, btn = document.createElement("button");
    if (v === "pass") pass++; if (v === "fail") fail++;
    btn.className = (i === at ? "cur " : "") + (v || ""); btn.title = b.name;
    btn.innerHTML = `<img src="img/${b.id}/thumb.jpg" alt="${b.name}">`; btn.onclick = () => show(i); $("strip").append(btn);
  });
  $("tally").textContent = `${pass} pass, ${fail} need work, ${BIRDS.length - pass - fail} to go`;
  // scroll the strip itself, not the element into view: scrollIntoView also walks up to the
  // page, and the strip sits at the bottom of it, so every bird change scrolled the page down
  const cur = $("strip").querySelector(".cur");
  if (cur) $("strip").scrollLeft = cur.offsetLeft - ($("strip").clientWidth - cur.offsetWidth) / 2;
}
function verdict(v) {
  const b = BIRDS[at], saved = store.get(b.id);
  saved.verdict = saved.verdict === v ? "" : v; store.set(b.id, saved); show(at);
}
$("stage").addEventListener("mousemove", e => {
  const b = BIRDS[at], r = $("stage").getBoundingClientRect();
  loupe = { x: (e.clientX - r.left) / r.width * b.w - 100, y: (e.clientY - r.top) / r.height * b.h - 75 };
  place($("zooms").firstChild, loupe.x, loupe.y, 200);
});
$("prev").onclick = () => show(at - 1); $("next").onclick = () => show(at + 1);
$("play").onclick = () => play(!playing);
$("speed").oninput = () => play(playing);
$("showmarks").onchange = e => document.body.classList.toggle("hide-marks", !e.target.checked);
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { play(false); setMode(b.dataset.mode); });
$("pass").onclick = () => verdict("pass"); $("fail").onclick = () => verdict("fail");
$("note").oninput = e => { const b = BIRDS[at], s = store.get(b.id); s.note = e.target.value; store.set(b.id, s); };
$("copy").onclick = async () => {
  const lines = BIRDS.map(b => { const s = store.get(b.id); return `${s.verdict === "pass" ? "PASS" : s.verdict === "fail" ? "NEEDS WORK" : "not reviewed"} | ${b.file} (PR #${b.pr})${s.note ? " | " + s.note.replace(/\s+/g, " ") : ""}`; });
  try { await navigator.clipboard.writeText(lines.join("\n")); $("copy").textContent = "Copied"; } catch { prompt("Copy these notes:", lines.join("\n")); }
  setTimeout(() => $("copy").textContent = "Copy review notes", 1500);
};
addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowRight") show(at + 1); else if (e.key === "ArrowLeft") show(at - 1);
  else if (e.key === " ") { e.preventDefault(); play(!playing); }
  else if (e.key === "1") { play(false); setMode("scan"); } else if (e.key === "2") { play(false); setMode("plate"); }
  else if (e.key === "3") { play(false); setMode("flags"); }
  else if (e.key === "4") { play(false); setMode("diff"); }
  else if (e.key === "p") verdict("pass"); else if (e.key === "f") verdict("fail");
});
addEventListener("resize", layout);
if (BIRDS.length) { show(0); play(true); }
else $("name").textContent = "No birds.js beside this page - run build.py on the review folder first.";
</script>
</body>
</html>
