[project]
name = "fugleramme"
version = "0.16.0"
description = "E-ink bird frame: renders the latest BirdNET detection to an Inky panel and serves a stats dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Month names in the reader's language. Pure python - nothing to generate on the Pi.
    "babel>=2.17",
    "numpy>=2.4.6",
    "pillow>=10.0",
]

[project.scripts]
fugleramme-frame = "fugleramme.cli:main"
# Dev-only: same service with auto-restart on source change. Needs the dev group.
fugleramme-dev = "fugleramme.dev:main"
# Dev-only: a stand-in BirdNET-Go serving generated detections over its /api/v2.
fugleramme-fake-detector = "fugleramme.fake:main"
# Whether a detector answers everything the frame needs. The fake or a real one.
fugleramme-check = "fugleramme.check:main"

[project.optional-dependencies]
# Pi-only hardware. Not installed on the dev loop; the frame service
# degrades to web-only when it is absent. 2.2 is the floor for the Spectra 6
# boards: 2.1 added the 13.3" and 2.2 fixed its palette handling. gpiod is
# inky's own dependency, but the buttons are ours to read - it has no API for them.
panel = [
    "inky>=2.2",
    "gpiod>=2.1",
    "gpiodevice>=0.0.5",
]

# Both fields stay in step: the service reads __version__ from the checkout, which
# importlib.metadata would not track between `uv sync` runs on the Pi.
[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/fugleramme/__init__.py:__version__"]
commit_message = "chore: release v{version}"
# Nothing is published; the Pi runs from the checkout. The build step exists only
# to re-lock: uv.lock records the project's own version, and a stale one is rewritten
# by the next `uv sync`, leaving a dirty file where the self-update checks out a tag.
build_command = "uv lock"
assets = ["uv.lock"]
allow_zero_version = true
major_on_zero = false  # a feat on 0.x bumps the minor, not to 1.0

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore: release v"]

[tool.ruff]
line-length = 100  # what the code was already written to; 88 would rewrap a third of it
extend-exclude = ["scripts"]  # gitignored, workstation-only

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4"]
isort.combine-as-imports = true  # one line per module, aliases and all
# A missing panel or button chip degrades to web-only rather than raising, and the
# frame's day is the local one.
ignore = ["BLE001", "DTZ011"]

# Only the app and the docs hook: the tests would need a round of `assert x is not
# None` to say what a failing assert already says.
[tool.mypy]
python_version = "3.12"
files = ["src/fugleramme", "hooks"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["inky.*", "gpiod.*", "gpiodevice.*"]  # Pi-only, no stubs
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fugleramme"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0",
    "ruff>=0.14",
    "watchfiles>=0.24",
]
# Not in the default groups, so `uv sync` on the Pi stays lean. CI and
# `uv run --group docs mkdocs serve` pull it in explicitly.
docs = [
    "mkdocs-material>=9.5",
]
