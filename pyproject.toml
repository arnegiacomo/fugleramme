[project]
name = "fugleramme"
version = "0.3.0"
description = "E-ink bird frame: renders the latest BirdNET detection to an Inky panel and serves a stats dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=10.0",
]

[project.scripts]
fugleramme-frame = "fugleramme.cli:main"
# Dev-only: same service with auto-restart on source change. Needs the dev group.
fugleramme-dev = "fugleramme.dev:main"

[project.optional-dependencies]
# Pi-only hardware driver. Not installed on the Mac dev loop; the frame
# service degrades to web-only when it is absent. 2.2 is the floor for the
# Spectra 6 boards: 2.1 added the 13.3" and 2.2 fixed its palette handling.
panel = [
    "inky>=2.2",
]

# Both fields stay in step: the service reads __version__ from the checkout, which
# importlib.metadata would not track between `uv sync` runs on the Pi.
[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/fugleramme/__init__.py:__version__"]
commit_message = "chore: release v{version}"
build_command = ""  # nothing is published; the Pi runs from the checkout
allow_zero_version = true
major_on_zero = false  # a feat on 0.x bumps the minor, not to 1.0

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore: release v"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fugleramme"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "watchfiles>=0.24",
]
# Not in the default groups, so `uv sync` on the Pi stays lean. CI and
# `uv run --group docs mkdocs serve` pull it in explicitly.
docs = [
    "mkdocs-material>=9.5",
]
