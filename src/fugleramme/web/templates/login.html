{% extends "base.html" %}
{% block body %}
<form class="login" method="post" action="{{ LOGIN }}">
  <h1>Fugleramme</h1>
  <label><span>Admin password</span>
    <input type="password" name="password" autocomplete="current-password" autofocus></label>
  {% if error %}
  <p class="note bad" role="alert">{{ error }}</p>
  {% endif %}
  <button type="submit">Sign in</button>
  <p class="note"><a href="/">Back to the kiosk</a></p>
</form>
{% endblock %}
