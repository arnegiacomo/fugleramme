<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Saved to a home screen, it opens full-screen under its own icon. -->
<meta name="mobile-web-app-capable" content="yes">
<!-- The manifest's display does this from iOS 16.4; older iPads still read the meta. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2ede2">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Fugleramme</title>
<!-- Inline: one page, no reuse, and no two extra round trips to come up. -->
<style>
  html, body { margin: 0; height: 100%; }
  html { background: #f2ede2; }
  body { display: flex; align-items: center; justify-content: center; }
  /* Tiled right only once the page has a size, so it comes up with the page. */
  #paper { position: fixed; inset: 0; z-index: -1; background: url(/paper.png); opacity: 0; }
  #paper.up { opacity: 1; }
  /* The incoming page, centred by the collage's own rules; never eats a click. */
  #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  img { max-width: 100%; max-height: 100vh; object-fit: contain; }
  .fade { animation: in 3s ease-in-out; }
  @keyframes in { from { opacity: 0; } }
  p { font: 1rem/1.5 system-ui, sans-serif; color: #8a8880; text-align: center; }
  p a { color: inherit; }
  /* A video player's chrome: shown by a tap or a moving mouse, so the page at rest is only the picture. */
  #controls {
    position: fixed; inset: 0 0 auto; height: 6rem; display: flex; justify-content: flex-end; align-items: flex-start;
    padding: calc(8px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) 0 0;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .awake #controls, #controls:focus-within { opacity: 1; }
  .awake #settings { pointer-events: auto; }
  html:not(.awake) { cursor: none; }
  #settings { display: grid; place-items: center; width: 44px; height: 44px; color: #5c5a54; filter: drop-shadow(0 0 3px #f2ede2); }
  #settings svg { width: 26px; height: 26px; }
  #settings:focus-visible { outline: 2px solid #5c5a54; border-radius: 50%; }
  @media (prefers-reduced-motion: reduce) { #controls { transition: none; } }
</style>
</head>
<body>
<div id="paper"></div>
<img id="collage" src="/collage.png" alt="Birds seen recently" hidden>
<p id="waiting" hidden>Waiting for BirdNET-Go<br><a href="/admin">Configure it in the admin panel</a></p>
<div id="over"></div>
<div id="controls">
  <a id="settings" href="/admin" aria-label="Settings" title="Settings">
    <!-- Lucide's "settings" icon (ISC licence) -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
  </a>
</div>
<noscript><p>Fugleramme needs JavaScript to run in a browser.</p></noscript>
<script>
  const DELAY = 5000;  // /state is one query, no render
  const collage = document.getElementById("collage");
  const paper = document.getElementById("paper");
  const over = document.getElementById("over");
  const waiting = document.getElementById("waiting");
  // Only ever seen before the first render: once a page exists the server holds
  // it through an outage, so a blip leaves the birds up rather than a message.
  const show = (page) => { collage.hidden = !page; waiting.hidden = page; };
  const TILE = 512;  // render/paper.py TILE
  // Match the page's corner and scale, so its paper runs on past the edge.
  const fitPaper = () => {
    if (!collage.naturalHeight || !collage.clientHeight) return;
    const box = collage.getBoundingClientRect();
    paper.style.backgroundSize = TILE * box.height / collage.naturalHeight + "px";
    paper.style.backgroundPosition = box.left + "px " + box.top + "px";
  };
  const calm = matchMedia("(prefers-reduced-motion: reduce)");
  // Hidden until it loads, so the first page fades in like an update.
  collage.onload = () => {
    const reveal = collage.hidden && !calm.matches;
    show(true);
    fitPaper();
    paper.className = reveal ? "up fade" : "up";
    if (!reveal) return;
    collage.className = "fade";
    collage.onanimationend = () => { paper.className = "up"; collage.className = ""; };
  };
  addEventListener("resize", fitPaper);
  fitPaper();
  collage.onerror = () => show(false);
  // Crossfade in place; a new page shape moves the paper too, so that snaps.
  const swap = (next) => {
    const reshaped = next.naturalWidth * collage.naturalHeight !== next.naturalHeight * collage.naturalWidth;
    if (collage.hidden || reshaped || calm.matches) { collage.src = next.src; return; }
    next.className = "fade";
    next.alt = "";
    next.onanimationend = () => { collage.src = next.src; collage.decode().finally(() => next.remove()); };
    over.append(next);
  };
  const root = document.documentElement;
  let fade;
  const sleep = () => { clearTimeout(fade); root.classList.remove("awake"); };
  const wake = () => {
    root.classList.add("awake");
    clearTimeout(fade);
    fade = setTimeout(sleep, 3000);
  };
  // A mouse wakes the controls while it moves; a tap toggles them, as in a photo viewer.
  addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") wake(); });
  addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" || !root.classList.contains("awake")) return wake();
    if (!e.target.closest("#settings")) sleep();
  });
  let token = null;
  async function tick() {
    try {
      const state = await (await fetch("/state", {cache: "no-store"})).json();
      if (state.token !== token) {
        token = state.token;
        const next = new Image();  // decode before swapping, so the frame never blanks
        next.onload = () => swap(next);
        next.src = "/collage.png?v=" + encodeURIComponent(token);
      }
    } catch (e) {}  // transient: retry next tick
    setTimeout(tick, DELAY);
  }
  tick();
</script>
</body>
</html>
