services:
  birdnet-go:
    # BirdNET-Go ships only nightlies; pin a dated one and bump deliberately.
    image: ghcr.io/tphakala/birdnet-go:nightly-20260615
    container_name: birdnet-go
    restart: unless-stopped
    environment:
      - TZ=Europe/Oslo               # BirdNET-Go's local day boundaries / logs
      # Run as the host user so the entrypoint's chown of /config and /data
      # doesn't leave the bind-mounted files owned by a foreign uid. setup.sh sets these.
      - BIRDNET_UID=${BIRDNET_UID:-1000}
      - BIRDNET_GID=${BIRDNET_GID:-1000}
      # Pin ALSA's default card to the USB mic; the Pi's HDMI cards 0/1 have no
      # capture stream, breaking enumeration. setup.sh derives it.
      - ALSA_CARD=${ALSA_CARD:-}
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio                        # or the GID from `getent group audio`
    volumes:
      - ./config:/config
      # Persistent: BirdNET-Go writes birdnet.db here; the frame reads it read-only.
      - ./data:/data
    # Throwaway churn kept off the card: debug logs (~26GB ceiling at BirdNET-Go's
    # defaults) and HLS segments. Sized so a runaway logger fills RAM, not disk.
    tmpfs:
      - /data/logs:size=128M,uid=${BIRDNET_UID:-1000},gid=${BIRDNET_GID:-1000},mode=0755
      - /config/hls:exec,size=50M,uid=${BIRDNET_UID:-1000},gid=${BIRDNET_GID:-1000},mode=0755
    ports:
      - "8090:8080"                  # 8080 is the frame kiosk
