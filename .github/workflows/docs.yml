name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - hooks/**
      - mkdocs.yml
      - .github/workflows/docs.yml
      - assets/artwork/**  # the badge counts and the species list
      - assets/birdnet_*  # the species list
  # Build on the PR too, so a broken link fails before it is deployed.
  pull_request:
    paths:
      - docs/**
      - hooks/**
      - mkdocs.yml
      - .github/workflows/docs.yml
      - assets/artwork/**  # the badge counts and the species list
      - assets/birdnet_*  # the species list
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --strict fails the build on broken internal links.
      - run: uv run --group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'  # a PR proves the build, main publishes it
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
