# The container image for a release tag, dispatched by `release.yml`. Separate
# from it so a slow or broken build cannot fail a version bump.
#
# The tag trigger below only catches a tag pushed by hand: one pushed with
# GITHUB_TOKEN starts no workflow run.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public: the package inherited the repo's visibility when it was created.
  IMAGE: ghcr.io/arnegiacomo/fugleramme

jobs:
  # A native runner per architecture - the arm build under qemu takes the better
  # part of an hour.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels go into the image config, so they are set here, not in the manifest
      # job. `.source` is also what makes GHCR link the package back to the repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          # A failed cache write once failed the whole build and left `latest` a release behind.
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }},ignore-error=true
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `type=ref` is what a workflow_dispatch off a branch gets: the semver
          # patterns produce nothing there, and a create with no -t fails.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
      # GHCR reads a multi-arch description from the index only, max 512 characters.
      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          DESCRIPTION: >-
            Fugleramme for a homelab or any machine with docker: the bird collage in a
            browser, web only. Docs: https://arnegiacomo.dev/fugleramme/container/
            Release notes: https://github.com/arnegiacomo/fugleramme/releases
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

      # No untagged-version cleanup on purpose: GHCR lists the per-architecture
      # images as untagged, but the tagged manifest list points at them, so
      # deleting them breaks `docker pull` for that arch. Pruning here would mean
      # dropping whole releases, tags and all.
