name: release

on:
  push:
    branches: [main]
  # Artwork lands as `chore`, which releases nothing. `force` ships that queue.
  workflow_dispatch:
    inputs:
      force:
        description: Bump with no releasable commit
        type: choice
        default: none
        options: [none, patch, minor]

permissions:
  contents: write
  actions: write  # to dispatch image.yml

concurrency:
  group: release

jobs:
  release:
    if: github.actor != 'github-actions[bot]'  # belt and braces against a bump loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # history back to the last tag
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: before
        run: echo "tag=$(git describe --tags --abbrev=0 || true)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      # Run through uv, not the official action: that one is a Docker action whose
      # image has no uv, and `build_command = "uv lock"` needs it. `version` commits,
      # tags, pushes and cuts the GitHub release on its own.
      - run: uv run --with "python-semantic-release>=10,<11" semantic-release version $FORCE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unquoted above so `none` expands to no argument at all.
          FORCE: ${{ inputs.force != '' && inputs.force != 'none' && format('--{0}', inputs.force) || '' }}
      # Dispatch, not `image.yml`'s tag trigger: a tag pushed with GITHUB_TOKEN
      # starts no workflow run. Never fails a release that is already tagged.
      - name: Build the image for the tag just cut
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ steps.before.outputs.tag }}
        run: |
          tag=$(git describe --tags --abbrev=0)
          if [ "$tag" = "$BEFORE" ]; then
            echo "No release was cut, nothing to build."
            exit 0
          fi
          gh workflow run image.yml --ref "$tag"
