name: Missing bird
description: Species your station hears that the artwork can't draw
labels: ["artwork"]
body:
  - type: markdown
    attributes:
      value: |
        Already cut the bird yourself? [Open a PR instead](https://github.com/arnegiacomo/fugleramme/blob/main/docs/adding-artwork.md).
  - type: textarea
    id: species
    attributes:
      label: Species
      description: One per line. The admin page's Detector tab can copy this list for you.
      placeholder: Sturnus unicolor (Spotless Starling) - 1204 detections
    validations:
      required: true

  - type: input
    id: region
    attributes:
      label: Region
      placeholder: Southern Spain

  - type: textarea
    id: plate
    attributes:
      label: Plates you have in mind
      description: Links to Wikimedia Commons, BHL or similar, and the licensing if it isn't obvious. Hand-drawn birds on plain paper work best.
