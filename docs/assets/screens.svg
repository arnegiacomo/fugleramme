d="text35" style="text-anchor:middle">Samsung Frame TV</text><text x="850.0903" y="206.6602" id="text36" style="text-anchor:middle">macOS wallpaper</text><path d="m 700.75,22.75 h 48" id="path10-1" style="fill:none;stroke:#555555;stroke-width:1.5;marker-end:url(#arrow-5)"/><path d="m 700.75,382.75 h 48" id="path10-5" style="fill:none;stroke:#555555;stroke-width:1.5;marker-end:url(#arrow-3)"/></svg>