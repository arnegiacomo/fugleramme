<svg viewBox="0 0 951.5 405.5" width="951.5" height="405.5" role="img" aria-labelledby="title desc" font-family="system-ui, '-apple-system', 'Segoe UI', sans-serif" font-size="14px" fill="#2b2b2b" version="1.1" id="svg36" sodipodi:docname="screens.svg" inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg"><title id="title">Where each screen gets its picture</title><desc id="desc">The detections and settings feed two renders. The render loop draws the panel's page, dithered and paced by Panel refresh; it goes to the Inky panel, frame.png and /frame.e6 for the external e-ink panel. The web render draws the web page on request in full colour; it is served as /collage.png to the browser kiosk, the Samsung Frame TV and the macOS wallpaper, and as the admin preview.</desc><defs id="defs1"><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0,0 10,5 0,10 Z" fill="#555555" id="path1"/></marker><marker id="arrow-5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0,0 10,5 0,10 Z" fill="#555555" id="path1-5"/></marker><marker id="arrow-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0,0 10,5 0,10 Z" fill="#555555" id="path1-9"/></marker></defs><rect x="0.75" y="180.75" width="200" height="44" rx="6" fill="#e9efe6" id="rect15-3" style="fill:#ffffff;fill-opacity:1;stroke:#555555;stroke-width:1.5"/><rect x="250.75" y="290.75" width="200" height="65" rx="6" fill="#e9efe6" id="rect15-5" style="stroke:#555555;stroke-width:1.5"/><rect x="250.75" y="50.75" width="200" height="65" rx="6" fill="#f3ebdd" id="rect18-8" style="stroke:#555555;stroke-width:1.5"/><path d="m 200.75,202.75 h 25 V 83.25